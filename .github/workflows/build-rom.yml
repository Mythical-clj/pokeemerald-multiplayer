name: Build ROM

on:
  push:
    branches: [ native-multiplayer ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: Build
        run: make -j$(nproc) all syms

      - name: Checksum
        run: sha1sum pokeemerald.gba | tee build-sha1.txt

      - name: Upload ROM and symbols
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-multiplayer
          path: |
            pokeemerald.gba
            pokeemerald.map
            pokeemerald.sym
            build-sha1.txt
