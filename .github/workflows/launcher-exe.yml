name: Windows launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/launcher/**'
      - '.github/workflows/launcher-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get the sync project's client
        run: git clone --depth 1 https://github.com/Mythical-clj/gen3-poke-multiplayer-overworld-sync.git sync
      - name: Install build tools
        run: pip install pyinstaller pyusb libusb-package
      - name: Build
        run: >
          pyinstaller --onefile --name EmeraldLink
          --paths sync/net
          --hidden-import client --hidden-import usb_link --hidden-import ws_link
          --hidden-import club_link --hidden-import protocol
          --hidden-import usb.backend.libusb1
          --collect-all libusb_package
          tools/launcher/owl_launcher.py
      - name: Smoke test
        run: dist/EmeraldLink.exe --run-client --help
      - uses: actions/upload-artifact@v4
        with:
          name: EmeraldLink-windows
          path: dist/EmeraldLink.exe
